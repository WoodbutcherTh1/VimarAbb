<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Elite Electrical Showroom">
  <defs>
    <linearGradient id="lg-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="lg-bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cffbe"/>
      <stop offset="1" stop-color="#39ff8f"/>
    </linearGradient>
    <linearGradient id="lg-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff8f" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#39ff8f" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- offset plate: the second brand, sitting behind -->
  <rect x="13" y="9" width="42" height="42" rx="12" fill="#0a0b0e" opacity="0.55"/>
  <rect x="13" y="9" width="42" height="42" rx="12" fill="none" stroke="#c9a227" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- front plate -->
  <rect x="5" y="13" width="46" height="46" rx="13" fill="url(#lg-plate)"/>
  <rect x="5" y="13" width="46" height="46" rx="13" fill="none" stroke="url(#lg-ring)" stroke-width="1.75"/>

  <!-- bolt -->
  <path d="M31.5 22 L20.5 39.5 L27.5 39.5 L24.5 50 L36 32 L29 32 Z" fill="url(#lg-bolt)"/>
</svg>
